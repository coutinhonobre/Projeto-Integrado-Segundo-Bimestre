version: 2

models:
  - name: stg_wisdm_features
    description: >
      Staging 1:1 sobre a fonte externa `wisdm_raw.wisdm_features`, com
      renomeio de colunas e uma chave substituta `window_uid`
      (`subject_id || '_' || activity_label || '_' || window_id`) usada para
      o teste de unicidade.
    columns:
      - name: subject_id
        description: Identificador do sujeito no WISDM (ex. "1600").
        data_tests:
          - not_null
      - name: window_uid
        description: >
          Chave substituta unica da janela (subject_id + activity_label +
          window_id).
        data_tests:
          - unique
          - not_null
      - name: window_id
        description: Indice sequencial da janela dentro do sujeito (0-based).
        data_tests:
          - not_null
      - name: activity_label
        description: >
          Atividade majoritaria da janela (codigo de uma letra, A-S exceto
          N - ver tabela de atividades do SDD).
        data_tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'O', 'P', 'Q', 'R', 'S']
      - name: label_purity
        description: >
          Fracao das amostras dentro da janela que pertencem a atividade
          majoritaria (>= 0.9 por construcao na Silver).
